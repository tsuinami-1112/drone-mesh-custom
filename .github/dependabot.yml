# Dependabot opens a pull request when one of the GitHub Actions pinned by
# commit SHA in .github/workflows/ has a newer release, updating the SHA and
# the version comment next to it. The Firmware workflow runs on that pull
# request, so an update that breaks a build shows up before it is merged.
#
# It does not watch `pip install platformio==...` inside the workflow or the
# esp-web-tools pin in flasher/build_site.py; those are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

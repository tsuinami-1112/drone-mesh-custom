; Example of stations.ini, the per-station build environments.
;
; The "Station setup (map)" task (PROJECT TASKS -> seeed_xiao_esp32c5 -> Custom)
; writes stations.ini for you; this file only shows what it contains. To start
; from it by hand, copy it to stations.ini (which is not committed: it records
; where your stations are) and edit the values.
;
; Each [env:<NODE_ID>] appears as its own entry in PROJECT TASKS; use its
; Platform > Erase Flash and General > Upload to flash that station.
;
;   extends                 env:seeed_xiao_esp32c5 for 5.8 GHz patches, or
;                           env:seeed_xiao_esp32c5_dualband for dual-band
;                           2.4 + 5.8 GHz patches (the build then sweeps 2.4 GHz too)
;   custom_node_id          the station's id in every report and in the mapper
;                           (letters, digits, _ and -; up to 23)
;   custom_station_lat/lon  surveyed position, WGS84 degrees; every mapper places
;                           the station from it (both, or neither)
;   custom_station_heading  true-north heading of face N, degrees clockwise
;   custom_antenna_dbi      gain of the patches, dBi (0..20; default 8). The firmware
;                           derives the beamwidth, sqrt(32400 / 10^(dBi/10)), and
;                           the bearing constant K from it, and reports all three
;                           in the boot line and the heartbeat
;   custom_antenna_beamwidth_deg
;                           -3 dB beamwidth from the datasheet or the stage 6 pattern
;                           sweep, when it differs from the derived one (20..180)
;   custom_bearing_k        measured K, degrees of bearing per dB of neighbour-sector
;                           difference, from the stage 6 sweep (0.5..20)
;   custom_antenna_dbi_24, custom_antenna_beamwidth_deg_24, custom_bearing_k_24
;                           the same for the 2.4 GHz patches of a dual-band station
;                           (default 6 dBi); ignored, with a warning, on a 5.8 GHz build
;
; Under ~60 deg of beamwidth (above ~9.5 dBi) four sectors 90 deg apart leave holes
; at the sector boundaries; the build warns when a station's values get there.

[env:RX01]
extends = env:seeed_xiao_esp32c5
custom_node_id = RX01
custom_station_lat = 33.497315
custom_station_lon = -111.926100
custom_station_heading = 15
custom_antenna_dbi = 8

[env:RX02]
extends = env:seeed_xiao_esp32c5
custom_node_id = RX02
custom_station_lat = 33.492642
custom_station_lon = -111.922865
custom_station_heading = 350
custom_antenna_dbi = 8
custom_antenna_beamwidth_deg = 75
custom_bearing_k = 3.2

[env:RX03]
extends = env:seeed_xiao_esp32c5_dualband
custom_node_id = RX03
custom_station_lat = 33.501120
custom_station_lon = -111.930455
custom_station_heading = 90
custom_antenna_dbi = 8
custom_antenna_dbi_24 = 6

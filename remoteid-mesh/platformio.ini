; PlatformIO Project Configuration File
;
; WiFi-only drone scanner (original variant, GPIO6/7 pinout). Protocol
; parsing comes from ../firmware-common/detect, shared with the other
; variants and unit tested on a desktop (cd ../firmware-common/test && make).
;
; Optional detection knobs (see src/main.cpp): -DDETECT_WIFI_HOP=0,
; -DDETECT_HOME_DWELL_MS=700, -DDETECT_AWAY_DWELL_MS=250, -DDETECT_MAVLINK=0,
; -DDETECT_FINGERPRINT=0
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Pinned (Arduino-ESP32 3.3.12) so local and CI builds match. Keep all four
; firmware folders on the same release when updating.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
lib_extra_dirs = ../firmware-common

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3

; RemoteID Mesh Detect - standard dual-core build
;
; Protocol parsing comes from ../firmware-common/detect (shared with the other
; variants, unit tested on a desktop). BLE comes from NimBLE-Arduino so that
; BLE 5 Long Range (coded PHY) Remote ID adverts are received; the
; CONFIG_BT_NIMBLE_EXT_ADV flag must be global because NimBLE-Arduino reads it
; while the library compiles.
;
; Optional detection knobs (see src/main.cpp): -DDETECT_WIFI_HOP=0,
; -DDETECT_HOME_DWELL_MS=700, -DDETECT_AWAY_DWELL_MS=250, -DDETECT_MAVLINK=0,
; -DDETECT_FINGERPRINT=0

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../firmware-common
build_flags =
  -std=gnu++17
  -D CONFIG_BT_NIMBLE_EXT_ADV=1
  -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=251
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.1

[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
; The board's default partition table caps the app at 1.25 MB and this image
; is ~1.28 MB (the pre-library build on main was ~1.31 MB, so the C6 never
; fit). min_spiffs gives each OTA slot 1.875 MB by shrinking the SPIFFS area,
; which nothing here uses; NVS is unchanged.
board_build.partitions = min_spiffs.csv

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3

; =============================================================================
; RemoteID Mesh Detect - Dual-Band (C5) / Single-Band (S3)
; WiFi (2.4+5GHz) + BLE drone detection with Meshtastic UART relay
;
; Protocol parsing comes from ../firmware-common/detect (shared with the other
; variants, unit tested on a desktop). CONFIG_BT_NIMBLE_EXT_ADV enables BLE 5
; Long Range reception and must be a global -D (NimBLE-Arduino reads it while
; the library compiles). Optional knobs: -DDETECT_HOME_DWELL_MS=400,
; -DDETECT_AWAY_DWELL_MS=120, -DDETECT_MAVLINK=0, -DDETECT_FINGERPRINT=0
; =============================================================================

[env]
; Pinned (Arduino-ESP32 3.3.12) so local and CI builds match. Keep all four
; firmware folders on the same release when updating.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../firmware-common
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3

; --- XIAO ESP32-C5 (dual-band 2.4GHz + 5GHz WiFi 6) ---
[env:seeed_xiao_esp32c5]
board = seeed_xiao_esp32c5

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -D CONFIG_BT_NIMBLE_EXT_ADV=1
    -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=251
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED

upload_speed = 115200

; --- XIAO ESP32-S3 (single-band 2.4GHz, fallback) ---
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CONFIG_BT_NIMBLE_EXT_ADV=1
    -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=251
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED

upload_speed = 921600

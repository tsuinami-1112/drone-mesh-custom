; =============================================================================
; Level 1 station v3 - XIAO ESP32-C5 as the 5.8 GHz analog FPV receiver
;
;   pio run -e seeed_xiao_esp32c5 -t erase     (every flash starts with a full erase:
;   pio run -e seeed_xiao_esp32c5 -t upload     stale PHY calibration data left the
;   pio run -e seeed_xiao_esp32c5 -t monitor    C5VRX receiver deaf after reflashes)
;
; Same pioarduino platform (Arduino core 3.3 / ESP-IDF 5.5) as the level 2
; firmware. No BLE, no ArduinoJson: the receiver is the Wi-Fi PHY held
; receive-only plus PARLIO, and the JSON is hand-built so the mesh line is
; budgeted byte for byte. Every tunable lives in include/config.h; override
; any of them here with -D (examples below).
;
; Stations: this environment is the generic bench build. Each deployed station
; gets its own environment in stations.ini (NODE_ID, position, heading), written
; by the "Station setup (map)" task under this environment's Custom tasks
; (pio run -e seeed_xiao_esp32c5 -t station_setup). See the README section
; "Station location and heading" and stations.example.ini.
; =============================================================================

[platformio]
extra_configs = stations.ini

[env:seeed_xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default_8MB.csv
extra_scripts = pre:tools/station.py      ; custom_* station options, "Station setup (map)" task

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    ; Station identity and position: per station in stations.ini (custom_node_id,
    ; custom_station_lat/lon/heading), not here. Country of deployment:
    ; -DRF_COUNTRY_CC='"DE"'
    ; Optional LNA + band-pass filter between the switch and the XIAO
    ; -DRF_FRONTEND_GAIN_DB=20.0f
    ; Bench calibration (stage 5 / 6)
    ; -DRSSI_CAL_DBM_AT_NOISE=-95.0f -DRSSI_CAL_SLOPE=1.0f -DRSSI_CAL_OFFSET_DB=0.0f
    ; -DBEARING_K_DEG_PER_DB=3.0f
    ; -DSECTOR_SWITCH_TABLE='{0x0,0x1,0x2,0x3}'
    ; Eight I/Q lanes as C5VRX proved them (needs the underside GPIO2-5 pads):
    ; -DIQ_LANE_BITS=4
    ; Make a missing undocumented PHY symbol a link error instead of a boot-time
    ; "rf":false report:
    ; -DC5PHY_STRONG_PHY_SYMBOLS=1

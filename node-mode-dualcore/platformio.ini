; =============================================================================
; Drone Sentinel - Node Mode Firmware
; colonelpanichacks
;
; Two build targets from the same project:
;   pio run -e remote_node   -> Detection node (WiFi+BLE drone scanning)
;   pio run -e home_node     -> Home receiver (UART bridge from Heltec mesh)
;
; Both target the Seeed XIAO ESP32S3 paired with a Heltec V4 (Meshtastic)
;
; Protocol parsing (Open Drone ID, DJI DroneID, MAVLink, fingerprints) comes
; from the shared library in ../firmware-common/detect, which is also unit
; tested on a desktop (cd ../firmware-common/test && make).
; =============================================================================

[platformio]
default_envs = remote_node, home_node

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../firmware-common

; -----------------------------------------------------------------------------
; REMOTE NODE - Detects drones via WiFi + BLE, sends JSON to Heltec V4 mesh
;
; BLE comes from h2zero/NimBLE-Arduino: the core's built-in BLE library has no
; extended-scan support, and Remote ID over BLE 5 Long Range (coded PHY) is
; what most European / Japanese add-on modules transmit. CONFIG_BT_NIMBLE_EXT_ADV
; must be a global -D because NimBLE-Arduino reads it while the library compiles.
;
; Optional detection knobs (see main_remote.cpp): -DDETECT_WIFI_HOP=0,
; -DDETECT_HOME_DWELL_MS=700, -DDETECT_AWAY_DWELL_MS=250, -DDETECT_MAVLINK=0,
; -DDETECT_FINGERPRINT=0
; -----------------------------------------------------------------------------
[env:remote_node]
build_flags =
    -DREMOTE_NODE
    -std=gnu++17
    -D CONFIG_BT_NIMBLE_EXT_ADV=1
    -D CONFIG_BT_NIMBLE_MAX_EXT_ADV_DATA_LEN=251
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1

; Compile the remote main only; the home main would collide with
; main_remote.cpp's setup()/loop().
build_src_filter = +<*> -<main_home.cpp>

; -----------------------------------------------------------------------------
; HOME NODE - Receives mesh JSON from Heltec V4, forwards over USB serial
; No WiFi, no BLE, no detection - pure UART-to-USB bridge
; -----------------------------------------------------------------------------
[env:home_node]
build_flags =
    -DHOME_NODE
    -std=gnu++17

; Only the home node main - no detection libraries needed
build_src_filter = -<*> +<main_home.cpp>

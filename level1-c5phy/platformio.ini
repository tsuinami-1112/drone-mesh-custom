; =============================================================================
; Level 1 station v3 - XIAO ESP32-C5 as the FPV video-link receiver: analog FM
; and digital links at 5.8 GHz, plus 2.4 GHz on the dual-band environment
;
;   pio run -e seeed_xiao_esp32c5 -t erase     (every flash starts with a full erase:
;   pio run -e seeed_xiao_esp32c5 -t upload     stale PHY calibration data left the
;   pio run -e seeed_xiao_esp32c5 -t monitor    C5VRX receiver deaf after reflashes)
;
; Same pioarduino platform (Arduino core 3.3 / ESP-IDF 5.5) as the level 2
; firmware. No BLE, no ArduinoJson: the receiver is the Wi-Fi PHY held
; receive-only plus PARLIO, and the JSON is hand-built so the mesh line is
; budgeted byte for byte. Every tunable lives in include/config.h; override
; any of them here with -D (examples below).
;
; Stations: this environment is the generic bench build. Each deployed station
; gets its own environment in stations.ini (NODE_ID, position, heading, antenna
; gain), written by the "Station setup (map)" task under this environment's
; Custom tasks (pio run -e seeed_xiao_esp32c5 -t station_setup). See the README
; section "Station location and heading" and stations.example.ini. Stations
; with dual-band patches extend seeed_xiao_esp32c5_dualband below instead.
; =============================================================================

[platformio]
extra_configs = stations.ini

[env:seeed_xiao_esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default_8MB.csv
extra_scripts = pre:tools/station.py      ; custom_* station options, "Station setup (map)" task

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    ; Station identity, position and antennas: per station in stations.ini
    ; (custom_node_id, custom_station_lat/lon/heading, custom_antenna_dbi,
    ; custom_antenna_beamwidth_deg, custom_bearing_k), not here. Country of deployment:
    ; -DRF_COUNTRY_CC='"DE"'
    ; Optional LNA + band-pass filter between the switch and the XIAO
    ; -DRF_FRONTEND_GAIN_DB=20.0f
    ; Bench calibration (stage 5 / 6)
    ; -DRSSI_CAL_DBM_AT_NOISE=-95.0f -DRSSI_CAL_SLOPE=1.0f -DRSSI_CAL_OFFSET_DB=0.0f
    ; -DBEARING_K_SCALE=2.5f           (measured K / Gaussian-lobe K, once per antenna family)
    ; -DSECTOR_SWITCH_TABLE='{0x0,0x1,0x2,0x3}'
    ; Eight I/Q lanes as C5VRX proved them (needs the underside GPIO2-5 pads):
    ; -DIQ_LANE_BITS=4
    ; Make a missing undocumented PHY symbol a link error instead of a boot-time
    ; "rf":false report:
    ; -DC5PHY_STRONG_PHY_SYMBOLS=1

; -----------------------------------------------------------------------------
; Dual-band variant: the same board, switch and wiring, but the four patches are
; dual-band 2.4 + 5.8 GHz directional patches, so there is no 5.8 GHz band-pass
; filter in the chain (it would blind the 2.4 GHz plan) and an LNA, if any, is a
; wideband one. DUAL_BAND=1 adds the 2.4 GHz plan G1-G5 (2402..2482 MHz) to the
; sweep, puts the PHY in auto band mode and uses the *_24 calibration and antenna
; constants of include/config.h on 2.4 GHz. Stations with dual-band patches
; extend this environment (the Station setup page's "dual-band" choice writes
; extends = env:seeed_xiao_esp32c5_dualband; custom_antenna_dbi_24 and friends
; describe the 2.4 GHz patches). Everything else is inherited from the base build.
; -----------------------------------------------------------------------------
[env:seeed_xiao_esp32c5_dualband]
extends = env:seeed_xiao_esp32c5
build_flags =
    ${env:seeed_xiao_esp32c5.build_flags}
    -DDUAL_BAND=1
    ; 2.4 GHz bench calibration, the same meaning as the 5.8 GHz constants:
    ; -DRSSI_CAL_DBM_AT_NOISE_24=-95.0f -DRSSI_CAL_SLOPE_24=1.0f -DRSSI_CAL_OFFSET_DB_24=0.0f
    ; -DRF_FRONTEND_GAIN_DB_24=0.0f

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 440" width="1680" height="440" role="img" aria-labelledby="t d" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title id="t">Architecture</title>
<desc id="d">Solar-powered field stations (XIAO ESP32-S3 detector, UART to a Heltec V4 Meshtastic radio) relay detections over a multi-hop LoRa mesh to the home station (Heltec V4, UART to a XIAO ESP32-S3 dedup bridge, USB to mesh-mapper.py and its live web map).</desc>

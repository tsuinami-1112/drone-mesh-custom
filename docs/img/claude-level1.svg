<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="A small friendly orange sunburst character holding a 5.8 GHz patch antenna, with signal arcs">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F6C9B0"/>
      <stop offset="100%" stop-color="#D97757"/>
    </radialGradient>
    <style>
      .ray { fill: #D97757; }
      .arc { fill: none; stroke: #D97757; stroke-width: 4; stroke-linecap: round; opacity: 0.85; }
      .txt { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; fill: #6B4A3A; }
    </style>
  </defs>

  <!-- soft backdrop -->
  <rect x="0" y="0" width="420" height="320" rx="24" fill="#F7F3EC"/>

  <!-- sunburst body: twelve rounded rays around a glowing core -->
  <g transform="translate(170 150)">
    <g class="ray">
      <g id="r"><rect x="-11" y="-108" width="22" height="58" rx="11"/></g>
      <use href="#r" transform="rotate(30)"/>
      <use href="#r" transform="rotate(60)"/>
      <use href="#r" transform="rotate(90)"/>
      <use href="#r" transform="rotate(120)"/>
      <use href="#r" transform="rotate(150)"/>
      <use href="#r" transform="rotate(180)"/>
      <use href="#r" transform="rotate(210)"/>
      <use href="#r" transform="rotate(240)"/>
      <use href="#r" transform="rotate(270)"/>
      <use href="#r" transform="rotate(300)"/>
      <use href="#r" transform="rotate(330)"/>
    </g>
    <circle r="62" fill="url(#glow)"/>

    <!-- face -->
    <circle cx="-20" cy="-8" r="6" fill="#3B2A24"/>
    <circle cx="20" cy="-8" r="6" fill="#3B2A24"/>
    <circle cx="-17" cy="-10" r="2" fill="#fff"/>
    <circle cx="23" cy="-10" r="2" fill="#fff"/>
    <path d="M-22 18 Q0 38 22 18" fill="none" stroke="#3B2A24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-38" cy="14" r="8" fill="#F08A7A" opacity="0.55"/>
    <circle cx="38" cy="14" r="8" fill="#F08A7A" opacity="0.55"/>

    <!-- little arm holding the patch antenna -->
    <path d="M58 20 Q90 10 112 -22" fill="none" stroke="#D97757" stroke-width="12" stroke-linecap="round"/>
    <path d="M58 20 Q90 10 112 -22" fill="none" stroke="#F6C9B0" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- 5.8 GHz patch antenna on a short stalk -->
  <g transform="translate(286 110) rotate(-18)">
    <rect x="-3" y="16" width="6" height="40" rx="3" fill="#8C6A5A"/>
    <rect x="-34" y="-30" width="68" height="52" rx="6" fill="#2F6F8F" stroke="#1C4B63" stroke-width="3"/>
    <rect x="-20" y="-18" width="40" height="28" rx="3" fill="#C9A24B" stroke="#8E6E2B" stroke-width="2"/>
    <circle cx="0" cy="-4" r="3" fill="#1C4B63"/>
  </g>

  <!-- signal arcs from the antenna -->
  <g transform="translate(300 86)">
    <path class="arc" d="M18 -14 A26 26 0 0 1 26 14"/>
    <path class="arc" d="M34 -28 A46 46 0 0 1 46 22" opacity="0.6"/>
    <path class="arc" d="M50 -42 A66 66 0 0 1 66 30" opacity="0.35"/>
  </g>

  <!-- compass rose hint, bottom left -->
  <g transform="translate(66 250)" opacity="0.8">
    <circle r="22" fill="none" stroke="#D97757" stroke-width="2"/>
    <path d="M0 -20 L6 0 L0 20 L-6 0 Z" fill="#D97757"/>
    <path d="M-20 0 L0 -6 L20 0 L0 6 Z" fill="#F0B59B"/>
    <text x="0" y="-27" class="txt" font-size="10" text-anchor="middle" font-weight="700">N</text>
  </g>

  <text x="300" y="256" class="txt" font-size="22" font-weight="700" text-anchor="middle">level 1</text>
  <text x="300" y="278" class="txt" font-size="12" text-anchor="middle" opacity="0.8">5.8 GHz analog video · bearing stations</text>
  <text x="300" y="296" class="txt" font-size="11" text-anchor="middle" opacity="0.6">README under construction — Claude was here</text>
</svg>
